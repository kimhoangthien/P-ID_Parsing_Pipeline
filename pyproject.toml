[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "pid-parsing"
version = "0.1.0"
description = "Modular research foundation for parsing P&IDs into structured graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
research = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"]
# Add framework-specific extras when a reproducible baseline needs them.
# Future candidates: torch, ultralytics, paddleocr, networkx, shapely, streamlit.

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/pid_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
