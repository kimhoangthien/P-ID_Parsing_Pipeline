name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - run: uv run --locked --python ${{ matrix.python-version }} ruff check .
      - run: uv run --locked --python ${{ matrix.python-version }} ruff format --check .
      - run: uv run --locked --python ${{ matrix.python-version }} pytest
